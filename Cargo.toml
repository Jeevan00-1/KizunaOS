[package]
name = "kizuna-os"
version = "0.1.0"
edition = "2024"

[dependencies]
noto-sans-mono-bitmap = "0.3.2"
virtio-drivers = { version = "0.13.0", default-features = false, features = ["alloc"] }

[profile.dev]
panic = "abort"
opt-level = 2
debug = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = "thin"
codegen-units = 1
